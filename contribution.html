<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    #contributor-student-id {
      margin: 20px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor">Show Contributor</button>
  <p id="contributor-student-id"></p>

  <a href="index.html">Back to Task Manager</a>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      const output = document.getElementById('contributor-student-id');
      try {
        const res = await fetch('contribution.json');
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const data = await res.json();
        output.textContent = 'Contributor Student ID: ' + data.contributorStudentId;
      } catch (err) {
        output.textContent = 'Could not load contribution.json: ' + err.message;
      }
    });
  </script>
</body>
</html>
